<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="scene-03-template">
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--bg);
        }
        #scene-03-kicker {
          position: absolute;
          left: 65px;
          top: 300px;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
          font-weight: 700;
          font-size: 34px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--accent);
        }
        #scene-03-title {
          position: absolute;
          left: 65px;
          right: 65px;
          top: 360px;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
          font-weight: 800;
          font-size: 92px;
          line-height: 1.05;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        #scene-03-folder {
          position: absolute;
          left: 65px;
          top: 560px;
          width: 420px;
          height: 250px;
        }
        #scene-03-tab {
          position: absolute;
          left: 0;
          top: 0;
          width: 170px;
          height: 48px;
          border-radius: 16px 16px 0 0;
          background: var(--accent2);
        }
        #scene-03-body {
          position: absolute;
          left: 0;
          top: 34px;
          width: 420px;
          height: 216px;
          border-radius: 0 20px 20px 20px;
          background: var(--accent2);
          display: flex;
          align-items: flex-end;
          padding: 24px 30px;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
          font-weight: 800;
          font-size: 48px;
          color: var(--bg);
        }
        #scene-03-file {
          position: absolute;
          left: 560px;
          top: 640px;
          padding: 22px 30px;
          border-radius: 18px;
          background: var(--ink);
          color: var(--bg);
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
          font-weight: 700;
          font-size: 40px;
          white-space: nowrap;
        }
      </style>
      <div id="root" data-composition-id="scene-03" data-width="1080" data-height="940">
        <div id="scene-03-kicker">Paso 2</div>
        <div id="scene-03-title">Cópialo a source/</div>
        <div id="scene-03-folder">
          <div id="scene-03-tab"></div>
          <div id="scene-03-body">source/</div>
        </div>
        <div id="scene-03-file">mi-clip.mp4</div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#scene-03-kicker", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#scene-03-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
          tl.fromTo("#scene-03-folder", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.4);
          tl.fromTo("#scene-03-file", { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.7);
          // The file drops into the folder when the voice says "copias".
          tl.to("#scene-03-file", { x: -400, scale: 0.55, opacity: 0, duration: 0.6, ease: "power2.in" }, 1.5);
          tl.fromTo("#scene-03-folder", { scale: 1 }, { scale: 1.06, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 2.05);
          window.__timelines["scene-03"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
