<!doctype html>
<!--
  reels-split host composition (1080x1920). `npm run new` copies this file into
  projects/<slug>/ and fills the {{TOKENS}}; `npm run scenes` and
  `npm run reframe` rewrite only the blocks between their markers.
  The zones are fixed: content never leaves them (see docs/instagram-reels.md).
-->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style id="brand">
      /* {{BRAND_CSS}} */
    </style>
    <style id="talent">
      :root {
        --talent-x: 50%;
        --talent-y: 50%;
      }
    </style>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        font-family: {{FONT_STACK}};
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      /* Illustration zone: y 0-940. Text only inside y 270-860, x 65-1015. */
      #illus-bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 940px;
        background: var(--bg);
      }
      #root > .zone-illus {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 940px;
        overflow: hidden;
      }
      /* Person zone: y 940-1920; the face belongs between y 1000 and 1248. */
      #video-wrap {
        position: absolute;
        left: 0;
        top: 940px;
        width: 1080px;
        height: 980px;
        overflow: hidden;
        background: #000;
      }
      #talent {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: var(--talent-x) var(--talent-y);
      }
      /* Caption band: y 860-1000, on the seam between illustration and person. */
      #root > .zone-captions {
        position: absolute;
        left: 0;
        top: 860px;
        width: 1080px;
        height: 140px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="reel"
      data-start="0"
      data-duration="{{DURATION}}"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div id="illus-bg"></div>

      <!-- SCENES:START (generated by `npm run scenes` from storyboard.json) -->
      <!-- SCENES:END -->

      <div id="video-wrap">
        <video
          id="talent"
          src="assets/source.mp4"
          playsinline
          data-has-audio="true"
          data-start="0"
          data-duration="{{DURATION}}"
          data-track-index="1"
        ></video>
      </div>

      <div
        id="el-captions"
        class="zone-captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="3"
        data-width="1080"
        data-height="140"
      ></div>
    </div>
    <script>
      window.__timelines["reel"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
